configurations.configureEach {
    resolutionStrategy {
        force "com.github.GTNewHorizons:TinkersConstruct:1.14.115-GTNH"
    }

    exclude group: "com.github.GTNewHorizons", module: "CodeChickenLib"
    exclude group: "com.github.GTNewHorizons", module: "Hodgepodge"
    exclude group: "com.github.GTNewHorizons", module: "Baubles"
}

// deps may transitively add Baubles, so we replace it
project.getConfigurations()
        .all(c -> {
            final DependencySubstitutions ds = c.getResolutionStrategy()
                    .getDependencySubstitution();
            ds.substitute(ds.module("com.github.GTNewHorizons:Baubles"))
                    .using(ds.module("com.github.GTNewHorizons:Baubles-Expanded:2.2.25-GTNH"))
                    .withClassifier("dev")
                    .because("Baubles-Expanded replaces Baubles");
        });